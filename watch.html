<!doctype html>
<html lang="en" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEEWAN — Watch</title>
<link rel="stylesheet" href="style.css?v=903edb6">
</head>
<body>
<div class="bg" id="bg"></div>
<header>
<a class="brand" href="index.html">DEEWAN</a>
<nav id="tabs">
<a href="index.html" data-i18n="nav.home">Home</a>
<a href="browse.html" data-i18n="nav.browse">Browse</a>
<a href="browse.html?cat=movies" data-i18n="nav.movies">Movies</a>
<a href="browse.html?cat=tv" data-i18n="nav.tv">TV Shows</a>
<a href="browse.html?cat=anime" data-i18n="nav.anime">Anime</a>
<a href="browse.html?cat=kdrama" data-i18n="nav.kdrama">K-Drama</a>
<a href="browse.html?cat=turkey" data-i18n="nav.turkey">Turkish</a>
<a href="browse.html?cat=arabic" data-i18n="nav.arabic">Arabic • عربي</a>
</nav>
<form id="searchForm"><input id="q" data-i18n-ph="search.ph" placeholder="Search titles or tt… id"><button>⌕</button></form>
<div class="actions">
<button id="authBtn">Sign in</button>
<button id="langBtn" title="العربية / English">ع</button>
<button id="prefsBtn" title="Preferences">⚙</button>
</div>
</header>
<main id="layout">
<section class="player-wrap" id="watch">
<div class="player-bar">
<a class="back" href="browse.html" data-i18n="watch.back">← Back</a>
<span id="nowPlaying">—</span><span class="spacer"></span>
<label><span data-i18n="watch.server">Server</span> <select id="server"></select></label>
<label><span data-i18n="watch.sub">Sub</span> <select id="subLang">
<option value="en">English</option><option value="ar">العربية</option>
<option value="fr">Français</option><option value="es">Español</option>
<option value="de">Deutsch</option><option value="hi">हिन्दी</option>
<option value="ko">한국어</option><option value="ja">日本語</option>
</select></label>
<span id="epCtl" hidden>S<input id="season" type="number" min="1" value="1">E<input id="episode" type="number" min="1" value="1"></span>
<button id="nextBtn" hidden title="Next episode">⏭</button>
<button id="reloadBtn">↻</button>
<button id="hopBtn" title="Try next server">⇄</button>
<button id="theaterBtn" title="Theater">◐</button>
<button id="fsBtn" title="Fullscreen">⛶</button>
</div>
<div class="frame-box" id="frameBox"><iframe id="pf" allow="autoplay;fullscreen;picture-in-picture;encrypted-media" allowfullscreen referrerpolicy="origin"></iframe></div>
<button id="fsBig">⛶ Fullscreen</button>
<div class="hint" id="serverNote"></div>
</section>
<aside class="meta" id="meta">
<img id="poster" alt=""><div>
<h1 id="title">Loading…</h1><p id="sub"></p><p id="desc"></p><p id="cast"></p>
<div class="row"><a id="trailer" target="_blank" rel="noopener" data-i18n="btn.trailer">▶ Trailer</a>
<a id="subsLink" target="_blank" rel="noopener" data-i18n="btn.subs">⬇ Subtitles</a>
<button id="listBtn" data-i18n="btn.list">＋ My List</button>
<button id="likeBtn" title="Like">👍</button><button id="disBtn" title="Dislike">👎</button></div>
</div>
</aside>
</main>
<section class="shelf" id="epWrap" hidden><h2><span data-i18n="ep.title">Episodes</span> <span id="epCount"></span></h2><div class="seasons" id="seasonPills"></div><div class="ep-list" id="epList"></div></section>
<section class="shelf"><h2 data-i18n="rel.title">Related</h2><div class="row-posters" id="relGrid"></div></section>
<footer><a href="index.html">← Home</a> · <a href="browse.html">Browse</a></footer>
<dialog id="prefsDlg"><form method="dialog">
<h3 data-i18n="pref.title">Preferences</h3>
<label><span data-i18n="pref.server">Default server</span> <select id="pServer"></select></label>
<label><span data-i18n="pref.sub">Default subtitle</span> <select id="pSub"><option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option><option value="es">Español</option><option value="ko">한국어</option><option value="ja">日本語</option></select></label>
<label><span data-i18n="pref.theme">Theme</span> <select id="pTheme"><option value="dark" data-i18n="theme.dark">Dark</option><option value="light" data-i18n="theme.light">Light</option></select></label>
<label><input type="checkbox" id="pAuto" checked> <span data-i18n="pref.auto">Autoplay next episode (TV)</span></label>
<menu><button value="cancel" data-i18n="btn.close">Close</button><button id="pSave" value="default" data-i18n="btn.save">Save</button></menu>
</form></dialog>
<script src="turkey-ids.js?v=903edb6"></script>
<script src="common.js?v=903edb6"></script>
<script src="firebase-config.js?v=903edb6"></script>
<script src="auth.js?v=903edb6"></script>
<script src="watch.js?v=903edb6"></script>
</body>
</html>
